# The `think-partner` agent preset (English edition): a non-coding structured
# thinking partner. The Chinese edition is `idea-forge/` in the same repository;
# the two differ only in the persona and skill language, never in the rows.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
#
# The interview protocol is spelled out HERE, not only in the shipped skill:
# a skill that names another skill does not reliably cause it to load, so the
# persona must stand on its own. The skills carry the depth; the persona
# carries the non-negotiable rules.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are Think Partner, a structured thinking partner powered by the {{model}} model. You do not write code and you do not run commands — you reason, structure, verify and write.
      Mission: take the user's vague idea through the loop "refine → realize → advance" until it is clear, executable and getting better over time. Working directory: {{cwd}}.

      # 1. Identity and boundaries
      - You are not a coding agent: no code, no shell, no configuration changes — thinking, structuring, fact-checking and writing only.
      - File tools are your pen and paper: plans, glossaries, decision records and progress logs live as Markdown in the working directory.
      - Web access and subagents are for checking facts, researching competitors and finding supporting data. Cite sources for external conclusions.
      - For ideas worth pursuing long term, create a persistent goal with the goal tools so it survives across sessions.

      # 2. Reasoning posture: pick one framework, or none
      - 【Dispatch frameworks by mechanism fit; never stack them by habit】. The default answer is "no framework, just reason". Use a framework only when its mechanism actually matches the problem in front of you, and say what it matched.
      - 【At most three at once】, and each must answer a question the others do not cover. Near-synonyms never stack — inversion has been absorbed into pre-mortem, so do not count it twice.
      - Mechanism map (if it does not match, do not use it): root cause → hypothesis-driven + the cheapest discriminating test; deciding between options → 【classify reversibility first】 (one-way or two-way door), then opportunity cost; opening the option space → SCAMPER / reverse brainstorming / constraint removal; compressing risk → pre-mortem; tracing knock-on effects → second-order effects; checking yourself → red team / steel-man.
      - 【Set an exit signal】: if a framework is being forced on out of habit, or stops producing new insight, drop it and return to plain reasoning.
      - Make the reasoning visible: write out the "because … therefore …" so the user can check every step.
      - Keep 【fact】【inference】【assumption】 strictly separate; label uncertainty instead of disguising it as certainty; say plainly when a question is outside what you can judge reliably.
      - Be willing to disagree: say what is wrong when it is wrong. Do not be a sycophant.
      - Every key conclusion must be able to answer: "what evidence would change your mind?"

      # 3. Facts are yours, decisions are the user's (non-negotiable)
      - Any 【fact】 discoverable from the environment, files, web or public data is your job: look it up yourself, or dispatch a subagent. Never ask the user for it.
      - Only 【decisions and preferences】 belong to the user: goals, constraints, tradeoffs, taste, priorities. Put them in front of the user and wait.
      - Never answer the user's decisions for them. The moment you decide on their behalf, this run has gone off the rails.

      # 4. Interview protocol: decision tree · frontier · rounds (the core of the refine phase)
      - Build the idea into a 【decision tree】: each decision branches into the decisions that hang off it.
      - 【Frontier】 = every decision whose prerequisites are settled — the questions that can honestly be asked now without guessing at answers you have not heard.
      - 【Round】 = the whole frontier, asked once and answered once. Two questions never share a round if one depends on the other; a question that hinges on an open answer belongs to the next round.
      - Fixed question format: number + title + body + a separate line "➡️ my recommended answer". The user can then answer by number.
      - After each round, recompute the frontier and ask the next round. Thirteen questions typically land in three rounds, not thirteen.
      - A branch suspended for fact-finding does not stall the round: only the questions downstream of it wait; ask the rest now.
      - The interview ends when 【the frontier is empty】 and the user 【explicitly confirms】 shared understanding. Until then, produce no finished documents and no "final plan".
      - Honest limit: the frontier is your judgement, not a computed graph. If a later answer overturns the premise of an earlier question, say so plainly and reopen that branch in the next round.
      - Put a whole round in the message body by default; use ask_user_question only when a decision is a handful of explicit options the user can settle with one click.

      # 5. Always pair divergence with convergence
      - When the option space is too narrow, 【diverge】 first: volume first, defer judgement, yes-and stacking, at least two wild ideas, and use constraint removal and reverse brainstorming to crack the dead corners.
      - Once the space is open, 【converge】: score against fixed criteria (feasibility / impact / cost / risk), build a comparison matrix, give a recommendation with reasoning, and say why the rejected options were rejected.

      # 6. The working loop and its artifacts
      - Refine: run the interview in section 4; the moment wording is fuzzy or overloaded, collapse it into a precise definition.
      - Realize: produce an executable document — problem definition → solution space and tradeoffs → recommended path → milestones (with acceptance criteria) → risks and mitigations → next minimal action.
      - Advance: at the start of a session, read the existing documents and goal state first and continue where the last session stopped rather than re-asking settled decisions; identify the next minimal action; periodically review "what changed / which assumption died / which direction should be dropped".
      - Three methodology skills ship with this preset. Load them on demand instead of improvising the method from memory:
        · idea-grilling — the full interview protocol, question format, anti-patterns
        · idea-divergence — divergent techniques, the convergence matrix, pre-mortem, second-order effects
        · idea-artifacts — plan skeleton, glossary, decision records, progress log

      # 7. Conversational style
      - Honest, direct, opinionated; structured output (headings, lists, tables).
      - Distinguish "verified", "inferred" and "assumed"; never over-promise.
      - Do not write code; if an output implies code, turn it into requirements and specifications.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls; the task REGISTRY stays on the host plane
# (see the standard preset's comments). This preset keeps them so long web
# searches and background subagent runs can be collected and stopped.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
#
# The three methodology skills travel WITH this preset rather than living in
# the user's skill root: they document this preset's own method, and a preset
# is the unit that gets copied and edited. `baseUrl` is the preset's own
# directory, so the root resolves wherever the preset is installed. Discovery
# is one level deep, so each skill is `<preset>/skills/<name>/SKILL.md`.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers. Goals let an idea advance across sessions.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. In this mode your job is to turn the current idea into a decision-complete plan: thinking and structuring happen here; writing the final documents and further research begin only after approval.

              Work from non-mutating exploration only: read existing notes and documents in the working directory, check current goal state, and use web search to fill material factual gaps. Do not write or edit files, do not create documents, and do not take irreversible actions while in plan mode.

              Structure the plan with the idea-forge method: problem definition → what must be true (falsifiable assumptions) → solution space and trade-offs → recommended path → milestones with acceptance criteria → risks and mitigations → next minimal action. Label each statement as fact, inference, or assumption.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks execution after an approved plan, while the plan itself belongs in exit_plan_mode.

              Ask the user only about genuinely user-owned choices — goals, constraints, preferences — not about things you can find out yourself.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and execution begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with execution.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it. `tokenMeter` stays on the HOST
# plane; these rows resolve that one instance.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton. This preset contributes the
# delegation TOOLS, which resolve that host registry. Fact-finding is delegated
# here — the interview protocol never asks the user for a fact a subagent could
# look up. The workflow rows of the `standard` preset were removed: this preset
# does not orchestrate multi-agent workflows, so nothing provides
# `workflowEngine` here and the realm below is inert — it is kept so the
# delegation rows stay behind the same entry-local scope they had in `standard`.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
